name: Skeleton smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skeleton:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The integration smoke test follows the published Framework main.
      FRAMEWORK_REF: main
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify offline embedded CLI docs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tusk-docs-bin"
          go build -o "$RUNNER_TEMP/tusk-docs-bin/tusk" ./cmd/tusk
          index=$(env -i PATH="$RUNNER_TEMP/tusk-docs-bin" HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
            "$RUNNER_TEMP/tusk-docs-bin/tusk" docs)
          topic=$(env -i PATH="$RUNNER_TEMP/tusk-docs-bin" HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
            "$RUNNER_TEMP/tusk-docs-bin/tusk" docs runtime)
          case "$index" in *"Tusk Engine documentation (dev)"*"toolchain.md"*"upgrading.md"*) ;; *) echo "Offline docs index is incomplete" >&2; exit 1 ;; esac
          case "$topic" in *"Application bootstrap and RoadRunner runtime"*) ;; *) echo "Offline runtime guide is unavailable" >&2; exit 1 ;; esac

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, zip, sockets
          tools: composer:v2

      - name: Check smoke prerequisites
        id: prerequisites
        shell: bash
        run: |
          missing=()
          for tool in php composer go; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "SKIP skeleton smoke: missing prerequisites: ${missing[*]}"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out coordinated modern Framework and install dependencies
        if: steps.prerequisites.outputs.available == 'true'
        shell: bash
        run: |
          git clone --no-checkout https://github.com/tusk-framework/tusk-framework.git "$RUNNER_TEMP/tusk-framework"
          cd "$RUNNER_TEMP/tusk-framework"
          if ! git fetch --depth 1 origin "$FRAMEWORK_REF"; then
            echo "ERROR: Framework ref $FRAMEWORK_REF is unavailable" >&2
            exit 1
          fi
          resolved_framework_sha=$(git rev-parse FETCH_HEAD)
          echo "Using Framework $FRAMEWORK_REF at $resolved_framework_sha"
          git checkout --detach "$resolved_framework_sha"
          if ! test -f tusk-cli/stubs/bootstrap-app.stub || ! test -f tusk-cli/src/Generator/ProjectGenerator.php; then
            echo "ERROR: Framework ref $FRAMEWORK_REF lacks the required modern generator contract" >&2
            exit 1
          fi
          composer install --no-interaction --no-progress --prefer-dist

      - name: Provide RoadRunner
        if: steps.prerequisites.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tusk-tools"
          curl --fail --location --silent --show-error \
            https://github.com/roadrunner-server/roadrunner/releases/download/v2025.1.15/roadrunner-2025.1.15-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/tusk-tools/roadrunner.tar.gz"
          tar -xzf "$RUNNER_TEMP/tusk-tools/roadrunner.tar.gz" -C "$RUNNER_TEMP/tusk-tools"
          mv "$RUNNER_TEMP/tusk-tools/roadrunner-2025.1.15-linux-amd64/rr" "$RUNNER_TEMP/tusk-tools/rr"
          rm -rf "$RUNNER_TEMP/tusk-tools/roadrunner-2025.1.15-linux-amd64"
          chmod +x "$RUNNER_TEMP/tusk-tools/rr"
          echo "$RUNNER_TEMP/tusk-tools" >> "$GITHUB_PATH"

      - name: Run generated skeleton through RoadRunner
        if: steps.prerequisites.outputs.available == 'true'
        shell: pwsh
        run: ./test/skeleton/smoke.ps1 -FrameworkPath "$env:RUNNER_TEMP/tusk-framework" -RoadRunnerPath "$env:RUNNER_TEMP/tusk-tools/rr"
