name: Automatic release

on:
  workflow_run:
    workflows:
      - Go
      - Docker validation
      - Skeleton smoke
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: automatic-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      accepted: ${{ steps.accepted.outputs.accepted }}
      sha: ${{ steps.current-main.outputs.sha }}
      event-sha: ${{ steps.event.outputs.sha }}
      event-validated: ${{ steps.event-required.outputs.validated }}
      current-validated: ${{ steps.required.outputs.validated }}
    steps:
      - name: Check out trusted default-branch workflow code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow_run metadata
        id: event
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_REPOSITORY" != "$EXPECTED_REPOSITORY" || "$HEAD_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$HEAD_BRANCH" != "main" || "$EVENT_NAME" != "push" || \
                ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "accepted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$WORKFLOW_NAME" in
            "Go"|"Docker validation"|"Skeleton smoke") ;;
            *) echo "accepted=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "accepted=true" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve current main as the release candidate
        id: current-main
        if: steps.event.outputs.accepted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPOSITORY/commits/main" --jq .sha)"
          if [[ ! "$main_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "GitHub returned an invalid main commit SHA" >&2
            exit 1
          fi
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Verify all latest required checks for the exact SHA
        id: required
        if: steps.event.outputs.accepted == 'true'
        uses: ./.github/actions/verify-required-checks
        with:
          sha: ${{ steps.current-main.outputs.sha }}
          token: ${{ github.token }}

      - name: Verify latest required checks for the triggering SHA
        id: event-required
        if: steps.event.outputs.accepted == 'true'
        uses: ./.github/actions/verify-required-checks
        with:
          sha: ${{ steps.event.outputs.sha }}
          token: ${{ github.token }}

      - name: Set accepted validation output
        id: accepted
        if: steps.event.outputs.accepted == 'true' && (steps.required.outputs.validated == 'true' || steps.event-required.outputs.validated == 'true')
        shell: bash
        run: echo "accepted=true" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    if: needs.validate.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      action: ${{ steps.plan.outputs.action }}
      publish-main: ${{ steps.plan.outputs.publish_main }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Check out trusted default-branch release code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Reconcile tags and calculate release plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ needs.validate.outputs.sha }}
          EVENT_SHA: ${{ needs.validate.outputs.event-sha }}
          EVENT_VALIDATED: ${{ needs.validate.outputs.event-validated }}
          CURRENT_VALIDATED: ${{ needs.validate.outputs.current-validated }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          remote_main_sha="$(gh api "repos/$GH_REPOSITORY/commits/main" --jq .sha)"
          stable_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          target_sha=""
          retry_tag=""
          tag_is_automation_retry() {
            local tag="$1" sha="$2" tag_object contents
            tag_object="$(git cat-file -t "refs/tags/$tag" 2>/dev/null || true)"
            [[ "$tag_object" == "tag" ]] || return 1
            contents="$(git for-each-ref --format='%(contents)' "refs/tags/$tag")"
            grep -Fqx 'tusk-release-automation:v1' <<< "$contents" && grep -Fqx "source-sha:$sha" <<< "$contents"
          }
          calculate_next_tag() {
            local sha="$1" base_tag="${2:-}" previous calculation release version
            previous="$base_tag"
            if [[ -z "$previous" ]]; then previous="$(git tag --list 'v*' | grep -E "$stable_tag_pattern" | sort -V | tail -n 1 || true)"; fi
            [[ -n "$previous" ]] || { echo "No previous stable tag exists; configure an initial stable version before enabling automation." >&2; return 1; }
            git merge-base --is-ancestor "$previous" "$sha" || { echo "Latest stable tag is not an ancestor of the validated source commit" >&2; return 1; }
            calculation="$(go run ./cmd/tusk-release --previous-tag "$previous" --target-commit "$sha")"
            release="$(sed -n 's/^should_release=//p' <<< "$calculation")"
            [[ "$release" == "true" ]] || return 0
            version="$(sed -n 's/^version=//p' <<< "$calculation")"
            printf 'v%s' "$version"
          }
          previous_stable_tag() {
            go run ./cmd/tusk-release previous-tag --candidate-tag "$1" --expected-sha "$2" | sed -n 's/^tag=//p'
          }
          if [[ "$EVENT_SHA" != "$remote_main_sha" && "$EVENT_VALIDATED" == "true" ]]; then
            mapfile -t event_tags < <(git tag --points-at "$EVENT_SHA" | grep -E "$stable_tag_pattern" | sort -V || true)
            if (( ${#event_tags[@]} > 1 )); then
              echo "multiple stable release tags point at the triggering source commit; refusing ambiguous retry" >&2
              exit 1
            fi
            for tag in "${event_tags[@]}"; do
              previous_event_tag="$(previous_stable_tag "$tag" "$EVENT_SHA")"
              expected_event_tag="$(calculate_next_tag "$EVENT_SHA" "$previous_event_tag")"
              if [[ "$tag" != "$expected_event_tag" ]]; then
                echo "event stable tag does not match calculated SemVer; refusing retry" >&2
                exit 1
              fi
              if ! tag_is_automation_retry "$tag" "$EVENT_SHA"; then
                echo "event tag lacks the exact automation marker and source SHA" >&2
                exit 1
              fi
              retry_tag="$tag"
            done
          fi
          candidate_tag=""
          candidate_sha=""
          candidate_release="unknown"
          next_tag=""

          release_state() {
            local tag="$1" response_file status
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPOSITORY/releases/tags/$tag")"
            case "$status" in
              200)
                jq -e 'has("draft") and (.draft | type == "boolean")' "$response_file" >/dev/null || { rm -f "$response_file"; return 2; }
                if [[ "$(jq -r '.draft' "$response_file")" == "true" ]]; then
                  candidate_release="draft"
                else
                  candidate_release="published"
                fi
                ;;
              404) candidate_release="absent" ;;
              *) rm -f "$response_file"; return 1 ;;
            esac
            rm -f "$response_file"
          }
          release_state_or_fail() {
            local tag="$1"
            if ! release_state "$tag"; then
              echo "Could not safely determine release state for $tag; refusing to plan publication" >&2
              exit 1
            fi
          }

          if [[ -n "$retry_tag" ]]; then
            release_state_or_fail "$retry_tag"
            if [[ "$candidate_release" == "draft" || "$candidate_release" == "absent" ]]; then
              target_sha="$EVENT_SHA"
            elif [[ "$candidate_release" == "published" ]]; then
              echo "event SHA $EVENT_SHA already has a published release; only the current validated main SHA may be considered next"
              candidate_release="unknown"
            else
              echo "unexpected release state for retry tag $retry_tag" >&2
              exit 1
            fi
          fi
          if [[ -z "$target_sha" && "$remote_main_sha" == "$CURRENT_SHA" && "$CURRENT_VALIDATED" == "true" ]]; then
            target_sha="$CURRENT_SHA"
          elif [[ -z "$target_sha" && "$remote_main_sha" == "$EVENT_SHA" && "$EVENT_VALIDATED" == "true" ]]; then
            target_sha="$EVENT_SHA"
          fi
          if [[ -z "$target_sha" ]]; then
            echo "action=skip-stale" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "publish_main=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t tags_at_sha < <(git tag --points-at "$target_sha" | grep -E "$stable_tag_pattern" | sort -V || true)
          if (( ${#tags_at_sha[@]} > 0 )); then
            if (( ${#tags_at_sha[@]} > 1 )); then
              echo "multiple stable release tags point at the same source commit; refusing ambiguous retry" >&2
              exit 1
            fi
            expected_tag=""
            for tag in "${tags_at_sha[@]}"; do
              previous_candidate_tag="$(previous_stable_tag "$tag" "$target_sha")"
              expected_tag="$(calculate_next_tag "$target_sha" "$previous_candidate_tag")"
              if [[ -n "$expected_tag" && "$tag" == "$expected_tag" ]]; then
                if ! tag_is_automation_retry "$tag" "$target_sha"; then
                  echo "candidate tag lacks the exact automation marker and source SHA" >&2
                  exit 1
                fi
                candidate_tag="$tag"
              fi
            done
            if [[ -n "$candidate_tag" ]]; then
              candidate_sha="$target_sha"
              release_state_or_fail "$candidate_tag"
            elif [[ -n "$expected_tag" ]]; then
              echo "A stable tag exists for the validated SHA but does not match the calculated SemVer; refusing to release" >&2
              exit 1
            fi
          else
            if [[ "$remote_main_sha" != "$target_sha" ]]; then
              plan="$(go run ./cmd/tusk-release automatic-plan \
                --validated-sha "$target_sha" \
                --remote-main-sha "$remote_main_sha")"
              echo "action=$(sed -n 's/^action=//p' <<< "$plan")" >> "$GITHUB_OUTPUT"
              echo "tag=$(sed -n 's/^tag=//p' <<< "$plan")" >> "$GITHUB_OUTPUT"
              echo "publish_main=false" >> "$GITHUB_OUTPUT"
              echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            next_tag="$(calculate_next_tag "$target_sha")"
            if [[ -n "$next_tag" ]]; then
              remote_tag="$(git ls-remote --tags origin "refs/tags/$next_tag" "refs/tags/$next_tag^{}")"
              if [[ -n "$remote_tag" ]]; then
                candidate_tag="$next_tag"
                git fetch --no-tags origin "refs/tags/$candidate_tag:refs/tusk-release/$candidate_tag"
                candidate_sha="$(git rev-parse "refs/tusk-release/$candidate_tag^{commit}")"
                candidate_object="$(git cat-file -t "refs/tusk-release/$candidate_tag")"
                candidate_contents="$(git for-each-ref --format='%(contents)' "refs/tusk-release/$candidate_tag")"
                if [[ "$candidate_object" != "tag" ]] || ! grep -Fqx 'tusk-release-automation:v1' <<< "$candidate_contents" || ! grep -Fqx "source-sha:$target_sha" <<< "$candidate_contents"; then
                  echo "calculated release tag is already occupied by a tag not created by this workflow for the exact SHA" >&2
                  exit 1
                fi
                release_state_or_fail "$candidate_tag"
              fi
            fi
          fi

          if [[ -n "$candidate_tag" && -n "$candidate_sha" ]]; then
            next_tag=""
          fi
          plan="$(go run ./cmd/tusk-release automatic-plan \
            --validated-sha "$target_sha" \
            --remote-main-sha "$remote_main_sha" \
            --next-tag "$next_tag" \
            --candidate-tag "$candidate_tag" \
            --candidate-tag-sha "$candidate_sha" \
            --candidate-release "$candidate_release")"
          action="$(sed -n 's/^action=//p' <<< "$plan")"
          tag="$(sed -n 's/^tag=//p' <<< "$plan")"
          publish_main=false
          if [[ "$remote_main_sha" == "$target_sha" ]]; then publish_main=true; fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish_main=$publish_main" >> "$GITHUB_OUTPUT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Preflight official catalog and signing configuration
        if: steps.plan.outputs.action == 'create' || steps.plan.outputs.action == 'resume'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.plan.outputs.sha }}
          TUSK_CATALOG_SIGNING_KEY_B64: ${{ secrets.TUSK_CATALOG_SIGNING_KEY_B64 }}
          TUSK_CATALOG_KEY_ID: ${{ vars.TUSK_CATALOG_KEY_ID }}
          TUSK_CATALOG_TRUST_ANCHORS_B64: ${{ vars.TUSK_CATALOG_TRUST_ANCHORS_B64 }}
        run: |
          set -euo pipefail
          test -n "$TUSK_CATALOG_SIGNING_KEY_B64"
          test -n "$TUSK_CATALOG_KEY_ID"
          test -n "$TUSK_CATALOG_TRUST_ANCHORS_B64"
          payload="$RUNNER_TEMP/preflight-catalog-payload.json"
          git show "$TARGET_SHA:release/toolchain-catalog.payload.json" > "$payload"
          go run ./cmd/tusk-catalog validate --download --payload "$payload"
          go run ./cmd/tusk-catalog sign \
            --payload "$payload" \
            --catalog "$RUNNER_TEMP/preflight-catalog.json" \
            --provenance "$RUNNER_TEMP/preflight-provenance.json"

      - name: Create immutable annotated stable tag
        if: steps.plan.outputs.action == 'create'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          TARGET_SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          remote_main_sha="$(gh api "repos/$GH_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$remote_main_sha" != "$TARGET_SHA" ]]; then
            echo "main advanced before tag creation; refusing to tag a stale commit" >&2
            exit 1
          fi
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$remote_tag" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tusk-release/$RELEASE_TAG"
            existing_sha="$(git rev-parse "refs/tusk-release/$RELEASE_TAG^{commit}")"
            if [[ "$existing_sha" != "$TARGET_SHA" ]]; then
              echo "release tag already exists for a different commit" >&2
              exit 1
            fi
            existing_object="$(git cat-file -t "refs/tusk-release/$RELEASE_TAG")"
            existing_contents="$(git for-each-ref --format='%(contents)' "refs/tusk-release/$RELEASE_TAG")"
            if [[ "$existing_object" != "tag" ]] || ! grep -Fqx 'tusk-release-automation:v1' <<< "$existing_contents" || ! grep -Fqx "source-sha:$TARGET_SHA" <<< "$existing_contents"; then
              echo "existing tag is not an automation-created annotated tag for this exact SHA" >&2
              exit 1
            fi
            exit 0
          fi
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" \
            -m "Tusk Engine $RELEASE_TAG" \
            -m "tusk-release-automation:v1" \
            -m "source-sha:$TARGET_SHA"
          if ! git push origin "refs/tags/$RELEASE_TAG"; then
            remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
            if [[ -z "$remote_tag" ]]; then
              echo "could not publish the release tag" >&2
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tusk-release/race-check"
            raced_sha="$(git rev-parse 'refs/tusk-release/race-check^{commit}')"
            if [[ "$raced_sha" != "$TARGET_SHA" ]]; then
              echo "release tag was concurrently created for a different commit" >&2
              exit 1
            fi
            raced_object="$(git cat-file -t refs/tusk-release/race-check)"
            raced_contents="$(git for-each-ref --format='%(contents)' refs/tusk-release/race-check)"
            if [[ "$raced_object" != "tag" ]] || ! grep -Fqx 'tusk-release-automation:v1' <<< "$raced_contents" || ! grep -Fqx "source-sha:$TARGET_SHA" <<< "$raced_contents"; then
              echo "concurrent tag is not an automation-created annotated tag for this exact SHA" >&2
              exit 1
            fi
          fi

  publish-release:
    needs: release
    if: needs.release.outputs.action == 'create' || needs.release.outputs.action == 'resume'
    uses: ./.github/workflows/release.yml
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.release.outputs.tag }}
      expected-sha: ${{ needs.release.outputs.sha }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TUSK_CATALOG_SIGNING_KEY_B64: ${{ secrets.TUSK_CATALOG_SIGNING_KEY_B64 }}
      TUSK_CATALOG_KEY_ID: ${{ vars.TUSK_CATALOG_KEY_ID }}
      TUSK_CATALOG_TRUST_ANCHORS_B64: ${{ vars.TUSK_CATALOG_TRUST_ANCHORS_B64 }}

  publish-docker:
    needs:
      - validate
      - release
      - publish-release
    if: >-
      always() && needs.validate.outputs.accepted == 'true' && needs.release.result == 'success' &&
      (needs.publish-release.result == 'success' || needs.publish-release.result == 'skipped') &&
      (needs.release.outputs.publish-main == 'true' || needs.release.outputs.tag != '')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      image-name: ghcr.io/${{ github.repository }}
      source-ref: ${{ needs.release.outputs.sha }}
      publish-main: ${{ needs.release.outputs.publish-main == 'true' }}
      tags: ${{ needs.release.outputs.tag != '' && format('type=raw,value={0}', needs.release.outputs.tag) || '' }}
