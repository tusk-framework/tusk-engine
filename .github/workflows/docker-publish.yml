name: Docker image publication

on:
  workflow_call:
    inputs:
      image-name:
        description: Fully qualified image name, for example ghcr.io/owner/repository
        required: true
        type: string
      tags:
        description: Optional newline-separated additional image tags; main is always included
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=main
            ${{ inputs.tags }}

      - name: Build and push mutable main image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
