name: Docker image publication

on:
  workflow_call:
    inputs:
      image-name:
        description: Fully qualified image name, for example ghcr.io/owner/repository
        required: true
        type: string
      tags:
        description: Optional newline-separated additional image tags; main is always included
        required: false
        type: string
        default: ''
      source-ref:
        description: Exact validated source commit to build
        required: true
        type: string
      publish-main:
        description: Whether to publish the mutable main tag for this validated commit
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref }}

      - name: Recheck current main for mutable main tag
        id: current-main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source-ref }}
          REQUEST_MAIN: ${{ inputs.publish-main }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST_MAIN" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha="$(gh api "repos/$GH_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$main_sha" == "$SOURCE_REF" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "main advanced; publishing only immutable version tags for the validated source"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          tags: |
            ${{ steps.current-main.outputs.publish == 'true' && 'type=raw,value=main' || '' }}
            ${{ inputs.tags }}

      - name: Log into registry
        if: steps.meta.outputs.tags != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mutable main image
        uses: docker/build-push-action@v7
        if: steps.meta.outputs.tags != ''
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
