name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing stable release tag to publish
        required: true
        type: string
    secrets:
      TUSK_CATALOG_SIGNING_KEY_B64:
        required: true
      TUSK_CATALOG_KEY_ID:
        required: true
      TUSK_CATALOG_TRUST_ANCHORS_B64:
        required: true
      GH_TOKEN:
        required: true

permissions:
  contents: none

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      matches: ${{ steps.main.outputs.matches }}
      sha: ${{ steps.main.outputs.sha }}
      validated: ${{ steps.checks.outputs.validated }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify tag resolves to current main
        id: main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must be a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$TAG:refs/task4/$TAG"
          tag_sha="$(git rev-parse "refs/task4/$TAG^{commit}")"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$tag_sha" == "$main_sha" ]]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
            echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
            echo "Stable tag does not point to the current main commit" >&2
            exit 1
          fi
      - name: Check required main runs for exact source SHA
        id: checks
        uses: ./.github/actions/verify-required-checks
        with:
          sha: ${{ steps.main.outputs.sha }}
          token: ${{ github.token }}
      - name: Fail when required main checks have not passed
        if: always() && steps.main.outputs.matches == 'true' && (steps.checks.outcome == 'failure' || steps.checks.outputs.validated != 'true')
        shell: bash
        run: |
          echo "Required main push checks are missing, pending, or unsuccessful for this commit" >&2
          exit 1
      - name: Fail when tag does not point to current main
        if: always() && steps.main.outcome == 'failure'
        shell: bash
        run: |
          echo "Stable tag does not point to the current main commit or could not be resolved" >&2
          exit 1

  publish:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.matches == 'true' && needs.verify.outputs.validated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository for local publication action
        uses: actions/checkout@v5
      - name: Publish exact stable tag
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ inputs.tag }}
          expected-sha: ${{ needs.verify.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TUSK_CATALOG_SIGNING_KEY_B64: ${{ secrets.TUSK_CATALOG_SIGNING_KEY_B64 }}
          TUSK_CATALOG_KEY_ID: ${{ vars.TUSK_CATALOG_KEY_ID }}
          TUSK_CATALOG_TRUST_ANCHORS_B64: ${{ vars.TUSK_CATALOG_TRUST_ANCHORS_B64 }}
