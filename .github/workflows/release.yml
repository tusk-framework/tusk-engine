name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Validate official catalog payload
        run: go run ./cmd/tusk-catalog validate --download --payload release/toolchain-catalog.payload.json

      - name: Validate official catalog release inputs
        shell: bash
        env:
          TUSK_CATALOG_SIGNING_KEY_B64: ${{ secrets.TUSK_CATALOG_SIGNING_KEY_B64 }}
          TUSK_CATALOG_KEY_ID: ${{ vars.TUSK_CATALOG_KEY_ID }}
          TUSK_CATALOG_TRUST_ANCHORS_B64: ${{ vars.TUSK_CATALOG_TRUST_ANCHORS_B64 }}
        run: |
          test -s release/toolchain-catalog.payload.json
          test -n "$TUSK_CATALOG_SIGNING_KEY_B64"
          test -n "$TUSK_CATALOG_KEY_ID"
          test -n "$TUSK_CATALOG_TRUST_ANCHORS_B64"

      - name: Sign and verify official catalog
        shell: bash
        env:
          TUSK_CATALOG_SIGNING_KEY_B64: ${{ secrets.TUSK_CATALOG_SIGNING_KEY_B64 }}
          TUSK_CATALOG_KEY_ID: ${{ vars.TUSK_CATALOG_KEY_ID }}
          TUSK_CATALOG_TRUST_ANCHORS_B64: ${{ vars.TUSK_CATALOG_TRUST_ANCHORS_B64 }}
        run: |
          go run ./cmd/tusk-catalog sign \
            --payload release/toolchain-catalog.payload.json \
            --catalog release/toolchain-catalog.json \
            --provenance release/toolchain-catalog.provenance.json
          go run ./cmd/tusk-catalog verify \
            --catalog release/toolchain-catalog.json

      - name: Attest signed catalog
        uses: actions/attest@v4
        with:
          subject-path: release/toolchain-catalog.json

      - name: Attest catalog provenance
        uses: actions/attest@v4
        with:
          subject-path: release/toolchain-catalog.provenance.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUSK_CATALOG_TRUST_ANCHORS_B64: ${{ vars.TUSK_CATALOG_TRUST_ANCHORS_B64 }}
